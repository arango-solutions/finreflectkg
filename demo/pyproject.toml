[project]
name = "finreflectkg-demo"
version = "1.0.0"
description = "FinReflectKG time-travel demo for Arango Container Manager (BYOC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=1.3.1",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "api", "arango_client"]
