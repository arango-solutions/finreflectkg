<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinReflectKG · Time Travel</title>
  <script>
    // Resolve the theme before first paint to avoid a flash. LIGHT IS THE
    // UNCONDITIONAL DEFAULT: only an explicit choice the user made here switches to
    // dark. The OS preference is deliberately NOT consulted — a demo shown on a
    // dark-mode laptop should still open light unless the presenter asked for dark.
    (function () {
      try {
        var stored = localStorage.getItem('finreflectkg.theme');
        document.documentElement.setAttribute(
          'data-theme', stored === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/cytoscape.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">FinReflectKG <span>· Time&nbsp;Travel</span></div>
    <label class="ctl">Company
      <input id="ticker" list="tickers" autocomplete="off" placeholder="aapl">
      <datalist id="tickers"></datalist>
    </label>
    <label class="ctl grow">As&nbsp;of <b id="yearlbl">2018</b>
      <input id="year" type="range" min="2014" max="2024" step="1" value="2018">
    </label>
    <label class="ctl" title="Traversal depth from the company node: 1 = direct facts (clean star), 2+ = connected context">
      Depth
      <select id="depth">
        <option value="1" selected>1 · direct</option>
        <option value="2">2 · context</option>
        <option value="3">3 · wide</option>
      </select>
    </label>
    <label class="ctl" title="Valid = what HELD at mid-year (validFrom/validTo); Reported = what the filing ASSERTED that year (transaction time)">
      Time
      <select id="axis">
        <option value="valid" selected>valid</option>
        <option value="reported">reported</option>
      </select>
    </label>
    <label class="ctl toggle" title="Cleaned = junk dropped + generic hubs skolemized; Raw = as extracted">
      <input id="clean" type="checkbox" checked> <span>Cleaned</span>
    </label>
    <span id="meta" class="meta"></span>
    <button class="btn" id="btn-theme" type="button" onclick="toggleTheme()"
            aria-label="Toggle light or dark theme"
            title="Switch between light and dark mode. Your choice is remembered on this device.">&#9790;</button>
  </header>

  <main>
    <div id="cy"></div>
    <aside>
      <section>
        <h2>Influence <small id="infhdr"></small></h2>
        <label class="prctl" title="Keeps only entities that rank in the GLOBAL top-N by PageRank across the whole corpus (at this anchor year) — not the top-N within this company. The global leaders are corpus-wide hubs like 'net income' and 'united state', so only a fraction of them appear in any one company's neighbourhood; the count shows how many survive here.">
          <span>Graph filter: <b id="prlbl">all entities</b><span id="prkept" class="prkept"></span></span>
          <input id="pr" type="range" min="0" max="300" step="10" value="0">
        </label>
        <ol id="influence" class="rank"></ol>
      </section>
      <section>
        <h2>What changed <small id="diffhdr"></small></h2>
        <div class="diff">
          <div><h3 class="up">Appeared</h3><ul id="appeared"></ul></div>
          <div><h3 class="down">Disappeared</h3><ul id="disappeared"></ul></div>
        </div>
      </section>
      <section>
        <h2>Backward-looking disclosures</h2>
        <ul id="backward" class="bw"></ul>
      </section>
    </aside>
  </main>
  <div id="legend"></div>
  <script src="app.js"></script>
</body>
</html>
